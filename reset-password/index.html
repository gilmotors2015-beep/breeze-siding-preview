<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Admin Password | Breeze Siding</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/admin-login/login.css?v=login-4">
      <script src="/analytics.js?v=ga-1" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="reset-title">
        <p class="eyebrow">Breeze Siding Admin</p>
        <h1 id="reset-title">Change password</h1>
        <p class="login-copy" id="reset-copy">Checking secure admin login...</p>

        <form id="reset-request-form" class="login-form">
          <button class="button primary" type="submit">Sign in to continue</button>
          <p class="login-help"><a href="/admin-login/">Back to login</a></p>
          <p class="login-message" id="reset-request-message" aria-live="polite">Password changes require an active admin login.</p>
        </form>

        <form id="reset-update-form" class="login-form" hidden>
          <label>
            New password
            <input id="reset-password" type="password" autocomplete="new-password" minlength="12" required>
          </label>
          <label>
            Confirm new password
            <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="12" required>
          </label>
          <button class="button primary" type="submit">Update password</button>
          <p class="login-help"><a href="/admin/">Back to dashboard</a></p>
          <p class="login-message" id="reset-update-message" aria-live="polite">Use at least 12 characters with uppercase, lowercase, and a number.</p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
    <script src="/admin/private-admin-config.js?v=security-1" defer></script>
    <script src="reset-password.js?v=reset-4" defer></script>
  </body>
</html>

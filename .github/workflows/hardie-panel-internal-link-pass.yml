name: One-time Hardie panel internal link pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hardie-panel-internal-link-pass.yml

permissions:
  contents: write

jobs:
  link-pass:
    if: ${{ !contains(github.event.head_commit.message, 'Strengthen Hardie panel internal links') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add internal links to Hardie panel siding page
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replacementsByFile = {
            'siding-replacement.html': [
              [
                '<li>Hardie panel and modern accent walls</li>',
                '<li><a href="/hardie-panel-siding-seattle.html">Hardie panel and modern accent walls</a></li>'
              ],
              [
                '<li><a href="/james-hardie-siding-installer-seattle.html">James Hardie and fiber cement installation</a></li>',
                '<li><a href="/james-hardie-siding-installer-seattle.html">James Hardie and fiber cement installation</a></li><li><a href="/hardie-panel-siding-seattle.html">Hardie panel siding and modern accents</a></li>'
              ]
            ],
            'seattle-siding-costs.html': [
              [
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie vs vinyl siding</a></p>',
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie vs vinyl siding</a></p><p><a href="/hardie-panel-siding-seattle.html">Hardie panel siding</a></p>'
              ],
              [
                '<a href="/siding-window-flashing-details.html"><strong>Window flashing details</strong><span>Why water control changes the scope.</span></a>',
                '<a href="/siding-window-flashing-details.html"><strong>Window flashing details</strong><span>Why water control changes the scope.</span></a><a href="/hardie-panel-siding-seattle.html"><strong>Hardie panel siding</strong><span>Modern panel layouts, reveal details, and mixed-material exteriors.</span></a>'
              ]
            ],
            'hardieplank-siding-cost-seattle.html': [
              [
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie board vs vinyl</a></p>',
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie board vs vinyl</a></p><p><a href="/hardie-panel-siding-seattle.html">Hardie panel siding</a></p>'
              ],
              [
                'HardiePlank lap siding can be paired with Hardie shingles, board and batten, panel sections, belly bands, and clean window trim.',
                'HardiePlank lap siding can be paired with Hardie shingles, board and batten, <a href="/hardie-panel-siding-seattle.html">Hardie panel sections</a>, belly bands, and clean window trim.'
              ]
            ],
            'siding-materials-seattle.html': [
              [
                '<p><a href="/hardieplank-siding-cost-seattle.html">HardiePlank cost</a></p>',
                '<p><a href="/hardieplank-siding-cost-seattle.html">HardiePlank cost</a></p><p><a href="/hardie-panel-siding-seattle.html">Hardie panel siding</a></p>'
              ],
              [
                'Hardie panels and other panel-style systems can create clean modern lines.',
                '<a href="/hardie-panel-siding-seattle.html">Hardie panels</a> and other panel-style systems can create clean modern lines.'
              ]
            ],
            'james-hardie-siding-installer-seattle.html': [
              [
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie board vs vinyl</a></p>',
                '<p><a href="/hardie-board-vs-vinyl-seattle.html">Hardie board vs vinyl</a></p><p><a href="/hardie-panel-siding-seattle.html">Hardie panel siding</a></p>'
              ],
              [
                'Hardie panel layouts and modern reveal details can sharpen newer homes or major exterior remodels',
                '<a href="/hardie-panel-siding-seattle.html">Hardie panel layouts</a> and modern reveal details can sharpen newer homes or major exterior remodels'
              ]
            ],
            'index.html': [
              [
                '<li>Fiber cement, cedar, engineered wood, and other exterior options</li>',
                '<li><a href="siding-replacement.html">Fiber cement siding</a>, <a href="james-hardie-siding-installer-seattle.html">James Hardie</a>, cedar, engineered wood, and <a href="hardie-panel-siding-seattle.html">Hardie panel accents</a></li>'
              ]
            ]
          };

          for (const [file, replacements] of Object.entries(replacementsByFile)) {
            if (!fs.existsSync(file)) continue;
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            for (const [from, to] of replacements) {
              if (html.includes(to)) continue;
              html = html.split(from).join(to);
            }
            if (html !== before) {
              fs.writeFileSync(file, html);
              console.log('updated ' + file);
            }
          }
          fs.rmSync('.github/workflows/hardie-panel-internal-link-pass.yml', { force: true });
          NODE
      - name: Commit link pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No link changes needed."
          else
            git commit -m "Strengthen Hardie panel internal links"
            git push
          fi

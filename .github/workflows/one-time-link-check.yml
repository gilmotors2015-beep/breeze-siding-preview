name: One-time internal link check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-link-check.yml

permissions:
  contents: write

jobs:
  link-check:
    if: ${{ !contains(github.event.head_commit.message, 'Remove one-time internal link check') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check internal links and local assets
        id: check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const ignoredDirs = new Set(['.git', '.github', 'node_modules']);
          const htmlFiles = [];
          const allFiles = new Set();

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignoredDirs.has(entry.name)) continue;
              const abs = path.join(dir, entry.name);
              const rel = path.relative(root, abs).replace(/\\/g, '/');
              if (entry.isDirectory()) walk(abs);
              else {
                allFiles.add(rel);
                if (rel.endsWith('.html')) htmlFiles.push(rel);
              }
            }
          }
          walk(root);

          function stripUrl(value) {
            return value
              .replace(/^https?:\/\/breezesiding\.com/i, '')
              .split('#')[0]
              .split('?')[0]
              .trim();
          }

          function existsInternal(url) {
            if (!url || url === '/' || url === '') return true;
            if (/^(mailto:|tel:|sms:|javascript:|data:)/i.test(url)) return true;
            if (/^https?:\/\//i.test(url) && !/^https?:\/\/breezesiding\.com/i.test(url)) return true;
            let clean = stripUrl(url);
            if (!clean || clean === '/') return true;
            clean = clean.replace(/^\//, '');
            try { clean = decodeURIComponent(clean); } catch {}
            const candidates = [];
            if (clean.endsWith('/')) candidates.push(clean + 'index.html');
            candidates.push(clean);
            if (!path.extname(clean)) candidates.push(clean + '.html', clean + '/index.html');
            return candidates.some(candidate => allFiles.has(candidate));
          }

          const issues = [];
          const sitemap = fs.existsSync('sitemap.xml') ? fs.readFileSync('sitemap.xml', 'utf8') : '';
          const sitemapUrls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          for (const url of sitemapUrls) {
            if (!existsInternal(url)) issues.push({ type: 'sitemap', file: 'sitemap.xml', target: url });
          }

          const attrRe = /(?:href|src)=["']([^"']+)["']/gi;
          const cssUrlRe = /url\(["']?([^"')]+)["']?\)/gi;
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const re of [attrRe, cssUrlRe]) {
              re.lastIndex = 0;
              for (const m of html.matchAll(re)) {
                const target = m[1];
                if (!existsInternal(target)) issues.push({ type: 'link', file, target });
              }
            }
          }

          const retired = [
            'assets/images/project-closeup.jpg',
            'assets/images/project-home.jpg',
            'assets/images/seattle-exterior-paint.jpg'
          ];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const bad of retired) {
              if (html.includes(bad)) issues.push({ type: 'retired-image-reference', file, target: bad });
            }
          }

          const report = [
            '# Internal Link Check',
            '',
            `HTML pages checked: ${htmlFiles.length}`,
            `Sitemap URLs checked: ${sitemapUrls.length}`,
            `Issues found: ${issues.length}`,
            ''
          ];
          if (issues.length) {
            for (const issue of issues) report.push(`- ${issue.type}: ${issue.file} -> ${issue.target}`);
          } else {
            report.push('No missing internal links, local assets, sitemap paths, or retired image references found.');
          }
          fs.writeFileSync('link-check-report.md', report.join('\n') + '\n');
          console.log(report.join('\n'));
          if (issues.length) process.exit(1);
          NODE
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-link-check.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup commit needed."
          else
            git commit -m "Remove one-time internal link check"
            git push
          fi
